{% extends "base.html" %}
{% block title %}<title>Create Game — EchoWithin</title>{% endblock %}
{% block content %}
<div class="content-wrapper" style="max-width: 720px;">
  <div class="ew-header-row">
    <h2>Create Game</h2>
    <a href="{{ url_for('game.games_list') }}" style="font-size:0.85rem; color:var(--primary-color); text-decoration:underline;">My lobbies</a>
  </div>
  <div class="ew-info-banner"><strong>Poll</strong> = community reflection, no right answer &bull; <strong>Trivia</strong> = cozy single-choice, accuracy only. Share a link and up to 30 players can join instantly.</div>
  <form method="POST" class="ew-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="ew-form-label">Title *</label>
    <input type="text" name="title" maxlength="100" required class="form-input" style="margin-bottom:0.8rem;" placeholder="e.g., Team check-in">
    <label class="ew-form-label">Question *</label>
    <input type="text" name="question" maxlength="200" required class="form-input" style="margin-bottom:0.8rem;" placeholder="e.g., One word for your week?">
    <label class="ew-form-label">Game type</label>
    <select name="game_type" id="game_type" onchange="document.getElementById('correct_wrap').style.display=this.value==='trivia'?'block':'none'" class="form-input" style="margin-bottom:0.8rem;">
      <option value="poll">Poll / reflection (no correct answer)</option>
      <option value="trivia">Cozy trivia (accuracy only)</option>
    </select>
    <label class="ew-form-label">Options (2-5)</label>
    <div id="opts">
      <input type="text" name="options" placeholder="Option 1" required class="form-input" style="margin-bottom:0.4rem;">
      <input type="text" name="options" placeholder="Option 2" required class="form-input" style="margin-bottom:0.4rem;">
    </div>
    <button type="button" onclick="if(document.querySelectorAll('[name=options]').length<5){const i=document.createElement('input'); i.name='options'; i.placeholder='Option '+(document.querySelectorAll('[name=options]').length+1); i.className='form-input'; i.style.marginBottom='0.4rem'; document.getElementById('opts').appendChild(i);}" class="ew-btn--outline ew-btn--sm" style="margin-bottom:0.8rem; display:inline-block; cursor:pointer;">+ Add option</button>
    <div id="correct_wrap" style="display:none; margin-bottom:0.8rem;">
      <label class="ew-form-label">Correct option (trivia only, optional)</label>
      <input type="text" name="correct_option" placeholder="Must match an option exactly" class="form-input">
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; margin-bottom:0.8rem;">
      <div>
        <label class="ew-form-label">Expiry</label>
        <select name="expires_in" class="form-input">
          <option value="">Never</option>
          <option value="1h">1 hour</option>
          <option value="1d">1 day</option>
          <option value="7d">7 days</option>
        </select>
      </div>
      <div style="display:flex; align-items:end;"><button type="submit" class="ew-btn" style="width:100%; padding:0.65rem;">Create &amp; get link</button></div>
    </div>
  </form>
</div>
{% endblock %}
