{% extends "base.html" %}
{% block title %} <title>Parental Consent</title> {% endblock %}


{% block content %}

<div class="auth-container">
    <div class="auth-forms">
        <div class="auth-form active">
            <h2 class="form-title">Parental Consent</h2>
            {% if success %}
            <p class="form-description">{{ message }}</p>
            <p class="form-description">The young person can now sign in to EchoWithin.</p>
            {% else %}
            <p class="form-description">{{ message }}</p>
            {% endif %}
        </div>
    </div>
</div>

{% endblock %}
