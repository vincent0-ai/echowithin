<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #f4f4f4; }
  iframe { display: block; width: 1440px; height: 2000px; border: 0; }
</style>
</head>
<body>
<script>
  if (location.search.indexOf('dark=1') !== -1) {
    try { localStorage.setItem('echowithin-theme', 'dark'); } catch (e) {}
  } else {
    try { localStorage.removeItem('echowithin-theme'); } catch (e) {}
  }
  var f = document.createElement('iframe');
  f.id = 'f';
  f.src = 'http://127.0.0.1:5057/';
  f.addEventListener('load', function () {
    try {
      var d = f.contentDocument;
      var banner = d.getElementById('cookie-consent-banner');
      if (banner) banner.style.display = 'none';
      f.style.height = d.documentElement.scrollHeight + 'px';
    } catch (e) {}
  });
  document.body.appendChild(f);
</script>
</body>
</html>
