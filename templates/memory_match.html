{% extends "base.html" %}

{% block title %}Memory Match{% endblock %}

{% block content %}
<style nonce="{{ csp_nonce }}">
    :root {
        --primary-color: #5D3A2E;
        --surface-bg: #fff;
        --card-bg: #f8f9fa;
        --border-color: #e0e0e0;
        --text-dark-color: #333;
        --text-secondary: #666;
        --text-muted: #999;
        --success-color: #28a745;
        --hover-bg: #f0f0f0;
    }

    /* Hide mobile reload button */
    #mobile-reload-btn, .mobile-fab { display: none !important; }

    .memory-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        font-family: sans-serif;
        color: var(--text-dark-color);
        text-align: center;
    }

    .setup-panel {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
    }

    .setup-panel select, .setup-panel button {
        padding: 10px;
        margin: 5px;
        border-radius: 4px;
        border: 1px solid var(--border-color);
        font-size: 16px;
    }

    .setup-panel button {
        background-color: var(--primary-color);
        color: white;
        cursor: pointer;
        border: none;
    }

    .setup-panel button:hover {
        opacity: 0.9;
    }

    .game-info {
        display: none;
        justify-content: space-between;
        margin-bottom: 20px;
        font-size: 18px;
        font-weight: bold;
    }

    .grid-container {
        display: none;
        grid-gap: 10px;
        justify-content: center;
        /* No perspective here on purpose: a perspective on the board makes every
           card render from the board's centre, so a transforming card is
           projected away from its slot (the "card slides aside" bug). Each
           card carries its own perspective instead. */
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
    }

    /* max-width caps the board, but the grid still has to shrink with the
       viewport on narrow phones: min() keeps it inside both bounds. */
    .grid-container.size-4x4 {
        grid-template-columns: repeat(4, 1fr);
        max-width: min(400px, 100%);
        margin: 0 auto;
    }

    .grid-container.size-6x6 {
        grid-template-columns: repeat(6, 1fr);
        max-width: min(600px, 100%);
        margin: 0 auto;
    }

    /* --- Card reveal -------------------------------------------------------
       The flat cross-fade is the DEFAULT layout so every viewport we did not
       explicitly target (narrow phone, tablet, desktop-mode mobile browser,
       fractional zoom widths) still gets a reveal that cannot mirror text.
       The 3D flip is added only on wide viewports.

       Flip rule: a card rotated 180deg must have a pre-rotated front or its
       label draws backwards, so both live in the same media block and can
       never disagree. Per-card perspective (inside the transform) keeps the
       rotation centred on the card instead of on the board. */
    .card {
        width: 100%;
        aspect-ratio: 1 / 1;
        position: relative;
        cursor: pointer;
        transform-style: flat;
    }

    /* Hover-capable pointers get the hover preview; touch devices never do. */
    @media (hover: hover) and (pointer: fine) {
        .card:not(.flipped):not(.matched):hover .card-back {
            border-color: var(--accent-color, var(--text-color));
        }
    }

    /* Solid-color match highlight + pop fits every theme, iOS included.
       box-shadow glows get dropped by mobile Safari during transforms, so a
       background tint is the reliable highlight there. */
    .card.matched .card-front {
        border-color: var(--success-color);
        background-color: color-mix(in srgb, var(--success-color) 18%, var(--surface-bg));
        animation: card-match-pop 0.4s ease;
    }

    /* Scale only: this keyframe is inherited by the flat layout, where the
       front is not rotated, so a rotateY here would mirror the label. */
    @keyframes card-match-pop {
        0%   { transform: scale(1); }
        50%  { transform: scale(1.06); }
        100% { transform: scale(1); }
    }

    .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: visible;
        -webkit-backface-visibility: visible;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-size: 2rem;
        user-select: none;
        overflow: hidden;
        text-align: center;
        padding: 4px;
        box-sizing: border-box;
        transition: opacity 0.15s ease;
    }

    /* Flat reveal: the back hides and the word shows in place. No transform is
       involved, so the card can neither mirror nor shift out of its slot. */
    .card-back { opacity: 1; }
    .card-front { opacity: 0; }
    .card.flipped .card-back { opacity: 0; }
    .card.flipped .card-front { opacity: 1; }

    /* Fronts show word labels (FLOWER, PHOTO…) — sized to stay inside the card. */
    .card-front {
        font-size: 0.85rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        line-height: 1.2;
        overflow-wrap: anywhere;
        word-break: break-word;
    }

    /* Phones: the flat layout stays, the words just scale down. */
    @media (max-width: 600px) {
        .card-face { font-size: 1.5rem; }
        .card-front { font-size: 0.72rem; }
    }

    .card-back {
        background-color: var(--primary-color);
        border: 2px solid var(--border-color);
    }

    .card-front {
        background-color: var(--surface-bg);
        border: 2px solid var(--border-color);
    }

    /* Wide viewports upgrade the reveal to a real 3D flip. Everything the flip
       needs (rotation + pre-rotated front + occluded faces) is declared here,
       so the two halves of the trick can never drift apart again. */
    @media (min-width: 601px) {
        .card {
            transform-style: preserve-3d;
            transition: transform 0.4s;
        }

        /* Perspective inside the transform keeps the rotation centred on the
           card, so a flipping card never slides out of its grid slot. */
        .card.flipped {
            transform: perspective(900px) rotateY(180deg);
        }

        .card-face {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transition: none;
            opacity: 1;
        }

        /* The card's own rotation decides which face is visible now, so undo
           the flat layout's opacity swap. */
        .card-back,
        .card.flipped .card-back,
        .card-front,
        .card.flipped .card-front {
            opacity: 1;
        }

        .card-front {
            transform: rotateY(180deg);
        }

        /* The pop must repeat the front's 180deg pre-rotation, otherwise it
           snaps back to the unrotated label for the duration of the animation. */
        .card.matched .card-front {
            animation: card-match-pop-3d 0.4s ease;
        }

        @keyframes card-match-pop-3d {
            0%   { transform: rotateY(180deg) scale(1); }
            50%  { transform: rotateY(180deg) scale(1.06); }
            100% { transform: rotateY(180deg) scale(1); }
        }
    }

    .modal {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    .modal-content {
        background: var(--surface-bg);
        padding: 30px;
        border-radius: 8px;
        text-align: center;
        max-width: 400px;
        width: 90%;
    }

    .modal-content h2 { margin-top: 0; }
    .modal-content button {
        margin-top: 20px;
        padding: 10px 20px;
        background-color: var(--primary-color);
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    #turn-indicator {
        color: var(--primary-color);
    }
</style>

<div class="memory-container">
    <h1>Memory Match</h1>
    
    <div class="setup-panel" id="setup-panel">
        <select id="mode-select">
            <option value="solo">Solo (Time Attack)</option>
            <option value="local">Local (Pass & Play)</option>
            <option value="online">Online (1v1)</option>
        </select>
        <select id="size-select">
            <option value="16">4x4 (Easy, 8 pairs)</option>
            <option value="36">6x6 (Hard, 18 pairs)</option>
        </select>
        <button id="start-btn">Start Game</button>
        <div id="online-status" style="margin-top: 10px; font-size: 14px; color: var(--text-secondary);"></div>
    </div>

    <div class="game-info" id="game-info">
        <div id="score-p1">P1: 0</div>
        <div id="turn-indicator">Your Turn</div>
        <div id="score-p2">P2: 0</div>
        <div id="timer" style="display: none;">Time: 0s</div>
    </div>

    <div class="grid-container" id="grid-container"></div>
</div>

<div class="modal" id="game-over-modal">
    <div class="modal-content">
        <h2 id="winner-text">Game Over</h2>
        <p id="stats-text"></p>
        <button id="replay-btn">Play Again</button>
    </div>
</div>

<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='socket.io.min.js') }}?v=4.7.2"></script>
<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='memory_match.js') }}?v=1.0"></script>
{% endblock %}
