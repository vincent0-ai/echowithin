{% extends "base.html" %}
{% block content %}
<div style="max-width:780px; margin:2rem auto; padding:0 1rem;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
    <h2 style="margin:0; color:#3e2217;"><i class="fas fa-poll"></i> Create Form</h2>
    <a href="{{ url_for('notes.personal_space') }}#forms" style="font-size:0.85rem; color:#3e2217; text-decoration:underline;">Back to Forms</a>
  </div>
  <p style="font-size:0.85rem; color:#666; background:#fdfaf9; border:1px solid #f5ebe7; border-radius:8px; padding:0.6rem 0.8rem;"><i class="fas fa-lock"></i> Responses are <strong>encrypted at rest</strong> with a server-held key (like community notes). Not E2E — anonymous submitters have no key. Only you can view/export.</p>
  <form method="POST" id="form-builder" style="background:#fff; border:1px solid #f5ebe7; border-radius:12px; padding:1.2rem;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label style="display:block; font-weight:600; margin-bottom:0.25rem;">Title *</label>
    <input type="text" name="title" maxlength="100" required style="width:100%; padding:0.55rem 0.7rem; border:1px solid #e8dcd5; border-radius:8px; margin-bottom:0.8rem;">
    <label style="display:block; font-weight:600; margin-bottom:0.25rem;">Description</label>
    <textarea name="description" maxlength="500" rows="2" style="width:100%; padding:0.55rem 0.7rem; border:1px solid #e8dcd5; border-radius:8px; margin-bottom:0.8rem;" placeholder="Optional — shown to submitters"></textarea>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; margin-bottom:0.8rem;">
      <div>
        <label style="display:block; font-weight:600; margin-bottom:0.25rem;">Expiry</label>
        <select name="expires_in" style="width:100%; padding:0.5rem; border:1px solid #e8dcd5; border-radius:8px;">
          <option value="">Never</option>
          <option value="1h">1 hour</option>
          <option value="1d">1 day</option>
          <option value="7d">7 days</option>
        </select>
      </div>
      <div>
        <label style="display:block; font-weight:600; margin-bottom:0.25rem;">Max responses</label>
        <input type="number" name="max_responses" min="1" max="10000" placeholder="Unlimited" style="width:100%; padding:0.5rem; border:1px solid #e8dcd5; border-radius:8px;">
      </div>
    </div>
    <input type="hidden" name="questions_json" id="questions_json">
    <div id="questions-container"></div>
    <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin:1rem 0;">
      <button type="button" onclick="addQuestion('short_text')" class="btn" style="background:#f5ebe7; border:1px solid #e8dcd5; border-radius:8px; padding:0.4rem 0.7rem; font-size:0.8rem;"><i class="fas fa-font"></i> Short text</button>
      <button type="button" onclick="addQuestion('paragraph')" class="btn" style="background:#f5ebe7; border:1px solid #e8dcd5; border-radius:8px; padding:0.4rem 0.7rem; font-size:0.8rem;"><i class="fas fa-align-left"></i> Paragraph</button>
      <button type="button" onclick="addQuestion('single_choice')" class="btn" style="background:#f5ebe7; border:1px solid #e8dcd5; border-radius:8px; padding:0.4rem 0.7rem; font-size:0.8rem;"><i class="fas fa-dot-circle"></i> Single choice</button>
      <button type="button" onclick="addQuestion('multiple_choice')" class="btn" style="background:#f5ebe7; border:1px solid #e8dcd5; border-radius:8px; padding:0.4rem 0.7rem; font-size:0.8rem;"><i class="fas fa-check-square"></i> Multiple</button>
      <button type="button" onclick="addQuestion('rating')" class="btn" style="background:#f5ebe7; border:1px solid #e8dcd5; border-radius:8px; padding:0.4rem 0.7rem; font-size:0.8rem;"><i class="fas fa-star"></i> Rating 1-5</button>
    </div>
    <button type="submit" class="btn" style="background:#3e2217; color:#fff; border-radius:8px; padding:0.7rem 1.2rem; width:100%; font-weight:600;">Create & get share link</button>
  </form>
</div>
<script nonce="{{ csp_nonce }}">
let questions = [];
function addQuestion(type){
  const id = Math.random().toString(36).slice(2,6);
  questions.push({id, label:'', type, required:false, options: type.includes('choice') ? ['Option 1','Option 2'] : []});
  render();
}
function render(){
  const c = document.getElementById('questions-container');
  c.innerHTML = questions.map((q, idx)=> `
    <div style="border:1px solid #f5ebe7; border-radius:10px; padding:0.8rem; margin-bottom:0.7rem; background:#fdfaf9;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
        <span style="font-size:0.75rem; background:#3e2217; color:#fff; padding:2px 6px; border-radius:6px;">${q.type}</span>
        <button type="button" onclick="questions.splice(${idx},1); render()" style="background:#fee; border:1px solid #fcc; color:#c0392b; border-radius:6px; padding:2px 8px; font-size:0.75rem;">Remove</button>
      </div>
      <input type="text" placeholder="Question label *" value="${q.label.replace(/"/g,'&quot;')}" oninput="questions[${idx}].label=this.value" style="width:100%; padding:0.5rem; border:1px solid #e8dcd5; border-radius:8px; margin-bottom:0.4rem;">
      <label style="font-size:0.78rem;"><input type="checkbox" ${q.required?'checked':''} onchange="questions[${idx}].required=this.checked"> Required</label>
      ${q.type.includes('choice') ? `<div style="margin-top:0.5rem;"><div style="font-size:0.78rem; font-weight:600; margin-bottom:0.3rem;">Options (2-10)</div>${q.options.map((o,oi)=> `<div style="display:flex; gap:0.4rem; margin-bottom:0.3rem;"><input type="text" value="${o.replace(/"/g,'&quot;')}" oninput="questions[${idx}].options[${oi}]=this.value" style="flex:1; padding:0.4rem; border:1px solid #e8dcd5; border-radius:6px;"><button type="button" onclick="questions[${idx}].options.splice(${oi},1); render()" style="background:#fee; border:1px solid #fcc; border-radius:6px; padding:2px 6px;">x</button></div>`).join('')}<button type="button" onclick="if(questions[${idx}].options.length<10){questions[${idx}].options.push('Option '+(questions[${idx}].options.length+1)); render()}" style="font-size:0.75rem; margin-top:0.3rem; background:#f5ebe7; border:1px solid #e8dcd5; border-radius:6px; padding:2px 8px;">+ Add option</button></div>` : ''}
    </div>
  `).join('');
}
document.getElementById('form-builder').addEventListener('submit', (e)=>{
  if(questions.length===0){ e.preventDefault(); alert('Add at least one question'); return; }
  for(const q of questions){ if(!q.label.trim()){ e.preventDefault(); alert('All questions need a label'); return; } if(q.type.includes('choice') && q.options.length<2){ e.preventDefault(); alert('Choice questions need at least 2 options'); return; } }
  document.getElementById('questions_json').value = JSON.stringify(questions);
});
addQuestion('short_text');
</script>
{% endblock %}
