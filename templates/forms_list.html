{% extends "base.html" %}
{% block content %}
<div style="max-width:900px; margin:2rem auto; padding:0 1rem;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
    <h2 style="margin:0; color:#3e2217;"><i class="fas fa-poll"></i> My Forms</h2>
    <a href="{{ url_for('forms.forms_create') }}" class="btn" style="background:#3e2217; color:#fff; border-radius:8px; padding:0.5rem 1rem; text-decoration:none;">+ New Form</a>
  </div>
  {% if forms %}
    {% for form in forms %}<div style="border:1px solid #f5ebe7; border-radius:10px; padding:1rem; margin-bottom:0.7rem; background:#fff;">
      <div style="font-weight:600; color:#3e2217;">{{ form.title }}</div>
      <div style="font-size:0.8rem; color:#666;">{{ form.response_count or 0 }} responses &bull; {{ form.questions|length }} questions</div>
      <div style="margin-top:0.5rem; display:flex; gap:0.5rem;">
        <a href="{{ url_for('forms.view_form', share_id=form.share_id) }}" style="font-size:0.8rem; background:#f5ebe7; border:1px solid #e8dcd5; border-radius:6px; padding:0.3rem 0.6rem; text-decoration:none;">View</a>
        <a href="{{ url_for('forms.form_responses_view', share_id=form.share_id) }}" style="font-size:0.8rem; background:#3e2217; color:#fff; border-radius:6px; padding:0.3rem 0.6rem; text-decoration:none;">Responses</a>
      </div>
    </div>{% endfor %}
  {% else %}
    <p style="color:#999; text-align:center; padding:2rem;">No forms yet. <a href="{{ url_for('forms.forms_create') }}" style="color:#3e2217; text-decoration:underline;">Create one</a></p>
  {% endif %}
</div>
{% endblock %}
