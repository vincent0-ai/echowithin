name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET: test-secret-key-for-ci
      MONGODB_CONNECTION: mongodb://localhost:27017
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MAIL_SERVER: smtp.example.com
      MAIL_PORT: 587
      MAIL_USERNAME: test@example.com
      MAIL_PASSWORD: test-password
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: test-key
      CLOUDINARY_API_SECRET: test-secret
      JIGSAW_API_KEY: test-jigsaw-key
      GOOGLE_CLIENT_ID: test-google-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: test-google-secret
      BYPASS_RATE_LIMIT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest flake8
      - name: Flake8 (errors only)
        run: flake8 --select=E9,F63,F82 --exclude=.venv .
      - name: Pytest Unit & Integration Tests
        run: pytest -q --ignore=tests/test_performance.py
      - name: Performance Latency Benchmark
        run: pytest tests/test_performance.py -s -v
