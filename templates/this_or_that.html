{% extends "base.html" %}

{% block title %}This or That{% endblock %}

{% block content %}
<style nonce="{{ csp_nonce }}">
    :root {
        --tot-primary: var(--primary-color);
        --tot-bg: var(--surface-bg);
        --tot-card: var(--card-bg);
        --tot-border: var(--border-color);
        --tot-text: var(--text-dark-color);
        --tot-text-sec: var(--text-secondary);
        --tot-text-mut: var(--text-muted);
        --tot-success: var(--success-color);
        --tot-hover: var(--hover-bg);
    }
    .mobile-fab, #mobile-reload-btn { display: none !important; }
    #tot-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        font-family: sans-serif;
        color: var(--tot-text);
        text-align: center;
    }
    h1 { color: var(--tot-primary); margin-bottom: 20px; }
    .hidden { display: none !important; }
    .btn {
        background-color: var(--tot-primary);
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        margin: 10px;
        transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    #setup-screen, #game-screen, #result-screen {
        background: var(--tot-card);
        border: 1px solid var(--tot-border);
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    
    #game-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        font-weight: bold;
        color: var(--tot-text-sec);
    }
    
    #timer-bar-container {
        width: 100%;
        height: 10px;
        background: var(--tot-bg);
        border-radius: 5px;
        overflow: hidden;
        margin-bottom: 30px;
    }
    #timer-bar {
        height: 100%;
        background: var(--tot-primary);
        width: 100%;
        transition: width 1s linear;
    }
    
    .options-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 30px;
    }
    @media (min-width: 600px) {
        .options-container { flex-direction: row; }
    }
    
    .option-card {
        flex: 1;
        background: var(--tot-bg);
        border: 2px solid var(--tot-border);
        border-radius: 12px;
        padding: 40px 20px;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 150px;
        word-break: break-word;
    }
    .option-card:hover {
        border-color: var(--tot-primary);
        background: var(--tot-hover);
    }
    .option-card.selected {
        border-color: var(--tot-primary);
        background: var(--tot-primary);
        color: white;
        transform: scale(1.02);
    }
    .option-card.disabled {
        pointer-events: none;
        opacity: 0.7;
    }
    
    #round-result {
        font-size: 24px;
        font-weight: bold;
        margin-top: 20px;
        min-height: 30px;
    }
    .in-sync { color: var(--tot-success); animation: pulse 0.5s ease; }
    .split { color: var(--tot-text-sec); }
    
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }
    
    .summary-item {
        background: var(--tot-bg);
        border: 1px solid var(--tot-border);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
        text-align: left;
    }
    .summary-item strong { display: block; margin-bottom: 5px; color: var(--tot-primary); }
    #final-verdict {
        font-size: 28px;
        font-weight: bold;
        color: var(--tot-primary);
        margin: 20px 0;
    }
    
    #waiting-overlay {
        margin-top: 20px;
        color: var(--tot-text-sec);
        font-style: italic;
    }
</style>

<div id="tot-container">
    <h1>This or That</h1>
    
    <div id="setup-screen">
        <h2>Select Game Mode</h2>
        <p>Are you in sync with your partner?</p>
        <div>
            <button class="btn" id="btn-solo">Solo Mode</button>
            <button class="btn" id="btn-local">Local (Pass & Play)</button>
            <button class="btn" id="btn-online">Online (With Partner)</button>
        </div>
        <div id="online-status" class="hidden" style="margin-top: 15px; color: var(--tot-text-sec);">Connecting...</div>
    </div>
    
    <div id="game-screen" class="hidden">
        <div id="game-info">
            <span id="round-display">Round 1/10</span>
            <span id="score-display">Score: 0</span>
        </div>
        <div id="timer-bar-container">
            <div id="timer-bar"></div>
        </div>
        <div class="options-container">
            <div class="option-card" id="option-a" data-choice="A">Option A</div>
            <div class="option-card" id="option-b" data-choice="B">Option B</div>
        </div>
        <div id="waiting-overlay" class="hidden">Waiting for partner...</div>
        <div id="round-result"></div>
        <button class="btn hidden" id="btn-next">Next Round</button>
    </div>
    
    <div id="result-screen" class="hidden">
        <h2>Game Over!</h2>
        <div id="final-score" style="font-size: 20px; margin: 15px 0;"></div>
        <div id="final-verdict"></div>
        <div id="history-container"></div>
        <button class="btn" id="btn-restart">Play Again</button>
    </div>
</div>

<script src="/socket.io/socket.io.js" nonce="{{ csp_nonce }}"></script>
<script src="/static/this_or_that.js" nonce="{{ csp_nonce }}"></script>
{% endblock %}
